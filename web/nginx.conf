upstream backend_api {
    server cbmedic-backend:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coherente con el límite de multer en el backend (5 MB por archivo)
    client_max_body_size 5m;
    absolute_redirect off;

    # --- Cabeceras de seguridad ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compresión gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ ^/(auth|health|reniec|uploads|caja|farmacias|categories|products|master|users|envios|clientes|ofertas|sales|servicios|comprobantes-servicios|config|configuracion-pago|auditoria|promociones|dashboard) {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Assets con hash de Vite (inmutables): cache larga
    location /assets/ {
        # OJO: add_header dentro de un location anula los heredados del
        # nivel server, por eso se repiten las cabeceras de seguridad aquí.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
